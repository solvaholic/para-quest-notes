# Filename collision-prone: a generic source name that an LLM might keep
# verbatim, set explicitly via source_filename. We just want it
# Title-Cased; nothing else in the test vault collides because we don't
# have a real vault here.
id: filename-generic-notes
title: "notes"
source_filename: notes.md
body: |
  People tend to remember stories more easily than isolated facts.
  Visual cues can make information feel more concrete, and
  repetition spaced over time appears to improve recall.
quest_catalog:
  - { name: Maintain Home, kind: side }
  - { name: Create,        kind: main }
expected:
  classify_para:
    type: resource
  pick_quest:
    skipped: true
  propose_filename:
    # Models tend to keep the title; canonical match means casing
    # doesn't matter, but the word should be there.
    canonical: "notes"
  plan_destination:
    destination: "resources/Notes.md"
