# Preserve-generic: a genuinely generic note - a grab-bag of unrelated
# jottings with no single topic. The source stem "notes" fails the
# structural check, so the LLM is asked; the right call is to keep the
# generic name rather than invent a topic the body doesn't support.
# Pairs with filename_generic_upgrade (same generic source, but a body
# that *does* justify upgrading). Asserts classify_para + propose_filename
# only: in eval, propose_filename's para_type is seeded from
# expected.classify_para, so classify stays asserted; pick_quest and
# plan_destination aren't the point of this fixture.
id: filename-generic-preserve
title: "notes"
source_filename: notes.md
body: |
  - Call the dentist back about rescheduling
  - Library books due Thursday
  - Try the new ramen place on 5th
  - Find the warranty card for the blender
expected:
  classify_para:
    type: resource
  propose_filename:
    # Nothing in the body justifies a more specific name; keep it generic.
    canonical: "notes"
