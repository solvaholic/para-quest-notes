# Preserve-generic: a genuinely generic note - unrelated trivia facts
# with no single dominant topic. The source stem "notes" fails the
# structural check, so the LLM is asked; the right call is to keep the
# generic name rather than invent a topic the body doesn't support.
# Pairs with filename_generic_upgrade as a single-variable A/B: same
# generic source ("notes.md"), same para type (resource), the ONLY
# difference is that the upgrade body has a dominant topic and this one
# doesn't. Asserts classify_para + propose_filename only: in eval,
# propose_filename's para_type is seeded from expected.classify_para,
# so classify stays asserted; pick_quest and plan_destination aren't
# the point of this fixture.
id: filename-generic-preserve
title: "notes"
source_filename: notes.md
body: |
  - The first moon landing was completed in 1969
  - Some dinosaurs were covered with feathers
  - Pokémon was created in Japan
  - Giant pandas are classified as bears
expected:
  classify_para:
    type: resource
  propose_filename:
    # Nothing in the body justifies a more specific name; keep it generic.
    canonical: "notes"
