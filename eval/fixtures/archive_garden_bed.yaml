title: Build Raised Beds
body: |
  # Build Raised Beds

  Reused cedar from the old fence and kept a running list of what fit the yard.

  ## Done
  - [x] Finalized a two-bed layout that still leaves room for the compost bin
  - [x] Cut and assembled the cedar frames
  - [x] Filled both beds and planted the first tomatoes and herbs

  ## Lessons
  The second bed went faster once the corner brackets were pre-drilled.
