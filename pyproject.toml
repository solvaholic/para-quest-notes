[project]
name = "para-quest-notes"
version = "0.5.0"
description = "Local, scripted workflows for managing PARA + Quest markdown notes with small LLMs via Ollama."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "solvaholic" }]
keywords = ["notes", "markdown", "para", "quest", "ollama", "obsidian", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Office/Business",
]
dependencies = [
    "faker>=40.36.0",
    "pyyaml>=6.0",
]

# CLI entry points are added per-workflow as they land.
[project.scripts]
pqn-ingest = "para_quest_notes.workflows.ingest_inbox.cli:main"
pqn-validate = "para_quest_notes.workflows.validate.cli:main"
pqn-create = "para_quest_notes.workflows.create.cli:main"
pqn-archive = "para_quest_notes.workflows.archive.cli:main"
pqn-daily = "para_quest_notes.workflows.daily.cli:main"
pqn-quests = "para_quest_notes.workflows.quests.cli:main"
pqn-tasks = "para_quest_notes.workflows.tasks.cli:main"
pqn-search = "para_quest_notes.workflows.search.cli:main"
pqn-config = "para_quest_notes.workflows.config.cli:main"
pqn-eval = "para_quest_notes.eval.__main__:main"

[project.urls]
Homepage = "https://github.com/solvaholic/para-quest-notes"
Repository = "https://github.com/solvaholic/para-quest-notes"
Issues = "https://github.com/solvaholic/para-quest-notes/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/para_quest_notes"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16.3",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_return_any = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
