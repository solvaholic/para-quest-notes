name: "Copilot Setup Steps"

# Pre-provision the Copilot cloud agent's ephemeral environment so it
# can run the same verification commands listed in AGENTS.md without
# burning turns on tool discovery.
#
# Mirrors the relevant prefix of .github/workflows/ci.yml. Auto-runs
# on changes so a PR that edits this file gets validated like any
# other workflow.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install project + dev deps
        run: uv sync --all-extras --dev
